[package]
name = "diapo-cli"
version = "0.1.0"
description = "Diapo, the Facile suite's slides: the command line"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "diapo_cli"
path = "src/lib.rs"

[[bin]]
name = "diapo"
path = "src/main.rs"

[dependencies]
facile-scene = { path = "../../crates/scene" }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tiny_http = "0.12.0"
ureq = "3.5.2"

[dev-dependencies]
tempfile = "3.27.0"
