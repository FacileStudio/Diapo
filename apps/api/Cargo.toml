[package]
name = "api"
version = "0.0.0"
description = "Diapo, the Facile suite's slides: the API"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
scene = { package = "facile-scene", path = "../../crates/scene", features = ["pptx", "planche"] }
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.1", features = ["http", "health", "spa", "migrate", "journal", "apiref", "bulle", "mcp"] }
porte = { git = "https://github.com/FacileStudio/porte-rs", tag = "v0.8.1", features = ["pg", "oidc", "directory", "exchange", "mcp"] }
salon = { git = "https://github.com/FacileStudio/salon", tag = "v0.1.0" }
planche = { git = "https://github.com/FacileStudio/planche", tag = "v0.3.0" }
async-trait = "0.1.92"
base64 = "0.23.1"
capture = { package = "diapo-capture", path = "../../crates/capture" }
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hmac = "0.13.0"
http = "1.5.0"
libc = "0.2.191"
schemars = "1.2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "derive", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "serde-well-known"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
url = "2.5.8"
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
yrs = { version = "0.28.1", features = ["sync"] }

[dev-dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.1", features = ["testdb", "mcptest"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = "0.29.0"
