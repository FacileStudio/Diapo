[package]
name = "api"
version = "0.0.0"
description = "Diapo, the Facile suite's slides: the API"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.1", features = ["http", "health", "spa", "migrate", "journal", "apiref", "bulle", "mcp"] }
porte = { git = "https://github.com/FacileStudio/porte-rs", tag = "v0.8.1", features = ["pg", "oidc", "directory", "exchange", "mcp"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "derive", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
utoipa = "6.0.0"

[dev-dependencies]
tronc = { git = "https://github.com/FacileStudio/tronc-rs", tag = "v0.5.1", features = ["testdb"] }
http = "1.5.0"
http-body-util = "0.1.5"
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
