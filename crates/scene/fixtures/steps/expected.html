<!doctype html>
<html lang="en" data-theme="facile" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steps</title>
<style>/* theme */</style>
<script>/* runtime */</script>
</head>
<body>
<main class="stage" data-width="1920" data-height="1080">
<section class="scene layout-default" data-index="0" data-steps="2" data-duration="6">
<div class="content">
<h2>Revenue</h2>
<ul>
<li data-step="1">Up 12%</li>
<li data-step="2">Churn down</li>
</ul>
<p data-step="2">Both at once.</p>
</div>
</section>
<section class="scene layout-default" data-index="1" data-steps="3" data-duration="8">
<div class="content">
<h3 data-step="1">A heading that waits</h3>
<ol>
<li data-step="2">
<p>First</p>
<p>Loose items reveal whole.</p>
</li>
</ol>
<blockquote data-step="3">
<p>A quote, last.</p>
</blockquote>
<p data-step="3" id="html-step">Raw HTML takes <code>data-step</code>.</p>
<p>Markers in code stay text: <code>{step=9}</code>.</p>
</div>
</section>
<section class="scene layout-default" data-index="2" data-steps="0" data-duration="2">
<div class="content">
<p>No steps here.</p>
</div>
</section>
</main>
</body>
</html>
