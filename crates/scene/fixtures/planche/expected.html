<!doctype html>
<html lang="en" data-theme="facile" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every shape</title>
<style>/* theme */</style>
<script>/* runtime */</script>
</head>
<body>
<main class="stage" data-width="1280" data-height="720">
<section class="scene layout-raw" data-index="0" data-steps="2" data-duration="12">
<style>.pl{position:absolute;margin:0}:is(.pl-text,.pl-sticky,.pl-rect,.pl-ellipse,.pl-diamond){overflow-wrap:break-word}:is(.pl-text,.pl-sticky,.pl-rect,.pl-ellipse,.pl-diamond)>:last-child{margin-bottom:0}.pl-rect,.pl-ellipse,.pl-diamond{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px}.pl-sticky{padding:32px;color:#1a1a1a;box-shadow:0 12px 32px rgba(0,0,0,.14)}.pl-image>img,.pl-video>video{display:block;width:100%;height:100%;max-width:none;max-height:none}.pl-card>a{display:flex;flex-direction:column;gap:12px;height:100%;padding:32px;border-radius:28px;background:var(--fill);text-decoration:none}.pl-card small{color:var(--muted)}</style>
<div class="pl pl-audio" style="left:0px;top:0px;display:none" data-start="0" data-duration="12"><audio src="assets/music.mp3" data-volume="0.4" hidden></audio></div>
<div class="pl pl-text" style="left:80px;top:60px;width:1120px;height:140px;text-align:center"><h1>Every <em>shape</em> {step=9}</h1>
</div>
<div class="pl pl-sticky" style="left:80px;top:240px;width:240px;height:200px;transform:rotate(0.1rad);background:#fde68a" data-step="1">Buy milk<br>then ship</div>
<div class="pl pl-rect" style="left:360px;top:240px;width:240px;height:120px;background:#dbeafe;outline:3px solid #1d4ed8;outline-offset:0;font-family:Georgia;font-size:28px" data-step="2"><p>Plain <strong>rich</strong> box</p>
</div>
<div class="pl pl-ellipse" style="left:640px;top:240px;width:160px;height:160px;opacity:0.5;background:#fecaca;border-radius:50%"></div>
<div class="pl pl-diamond" style="left:840px;top:240px;width:160px;height:160px;background:#bbf7d0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></div>
<div class="pl pl-line" style="left:80px;top:480px;width:400px;height:1px"><svg width="100%" height="100%" fill="#6b6b6b" stroke="#6b6b6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><path d="M0 0 L400 0" fill="none"/></svg></div>
<div class="pl pl-arrow" style="left:520px;top:480px;width:200px;height:60px"><svg width="100%" height="100%" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><path d="M0 0 L200 60" fill="none"/><polygon points="200,60 168.69,66.63 177.51,37.24" stroke="none"/></svg></div>
<div class="pl pl-ink" style="left:760px;top:480px;width:40px;height:30px"><svg width="100%" height="100%" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible"><path d="M0 0 L20 30 L40 10" fill="none"/></svg></div>
<div class="pl pl-image" style="left:1040px;top:240px;width:200px;height:160px"><img src="assets/chart.svg" alt="" style="object-fit:cover"></div>
<div class="pl pl-html" style="left:440px;top:560px;width:320px;height:120px"><div class="badge">Live <em>now</em></div>
    ---
<p>A rule above</p></div>
<div class="pl pl-card" style="left:800px;top:560px;width:400px;height:120px"><a href="https://example.com"><strong>Example</strong><span>A link card</span><small>example.com</small></a></div>
<div class="pl pl-video" style="left:80px;top:560px;width:320px;height:120px" data-start="2" data-duration="4" data-track-index="1"><video src="assets/clip.mp4" data-in="1.5" data-volume="0.8" muted playsinline style="object-fit:contain"></video></div>
</section>
<section class="scene layout-raw" data-index="1" data-steps="0" data-duration="4">
<style>.pl{position:absolute;margin:0}:is(.pl-text,.pl-sticky,.pl-rect,.pl-ellipse,.pl-diamond){overflow-wrap:break-word}:is(.pl-text,.pl-sticky,.pl-rect,.pl-ellipse,.pl-diamond)>:last-child{margin-bottom:0}.pl-rect,.pl-ellipse,.pl-diamond{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:24px}.pl-sticky{padding:32px;color:#1a1a1a;box-shadow:0 12px 32px rgba(0,0,0,.14)}.pl-image>img,.pl-video>video{display:block;width:100%;height:100%;max-width:none;max-height:none}.pl-card>a{display:flex;flex-direction:column;gap:12px;height:100%;padding:32px;border-radius:28px;background:var(--fill);text-decoration:none}.pl-card small{color:var(--muted)}</style>
<div class="pl pl-text" style="left:80px;top:300px;width:1120px;height:120px"><h2>Thank you</h2>
</div>
</section>
</main>
</body>
</html>
